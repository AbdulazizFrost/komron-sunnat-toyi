<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaqtincha Mavjud Emas</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet"></noscript>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0e0b06;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        /* Фоновый градиент */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 50% 0%, rgba(200,169,126,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 80% 80%, rgba(157,125,67,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 40px 52px;
            max-width: 420px;
            width: calc(100% - 40px);
            border: 1px solid rgba(200,169,126,0.2);
            border-radius: 24px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            animation: fadeUp 0.8s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            background: linear-gradient(135deg, #C8A97E, #7A5826);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(200,169,126,0.25);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(200,169,126,0.2); }
            50%       { box-shadow: 0 0 60px rgba(200,169,126,0.4); }
        }

        .icon svg { color: #fff; }

        .title {
            font-family: 'Cinzel', Georgia, serif;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 700;
            color: #C8A97E;
            letter-spacing: 0.06em;
            margin-bottom: 16px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 20px;
        }
        .divider span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(200,169,126,0.4), transparent); }
        .divider em { color: #C8A97E; font-style: normal; font-size: 14px; }

        .desc {
            font-size: 14.5px;
            color: rgba(255,255,255,0.55);
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .desc strong {
            color: rgba(255,255,255,0.85);
            display: block;
            margin-top: 8px;
            font-size: 15px;
        }

        .contact {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 10px;
        }

        .contact a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #C8A97E;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 24px;
            border: 1px solid rgba(200,169,126,0.3);
            border-radius: 50px;
            margin-top: 10px;
            transition: all 0.25s;
        }
        .contact a:hover {
            background: rgba(200,169,126,0.1);
            border-color: rgba(200,169,126,0.6);
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 36px;
        }
        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(200,169,126,0.4);
            animation: blink 1.4s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
            40%            { opacity: 1;   transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        </div>

        <h1 class="title">VAQTINCHA MAVJUD EMAS</h1>

        <div class="divider">
            <span></span><em>◈</em><span></span>
        </div>

        <p class="desc">
            Sayt hozirda texnik ishlar olib borilmoqda.<br>
            <strong>Tez orada qayta ishga tushadi.</strong>
        </p>

        <p class="contact">
            Murojaat uchun:
            <br>
            <a href="https://www.instagram.com/wedding_websites_uzbekistan/" target="_blank" rel="noopener noreferrer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
                @wedding_websites_uzbekistan
            </a>
        </p>

        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>
</html>
